<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTL - Music & Visual Artist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background-color: white;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .social-icons a:hover {
            transform: scale(1.2);
        }

        .social-icons img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            padding: 30px 10px;
            background-color: white;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 100px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .nav-button:nth-child(2),
        .nav-button:nth-child(4) {
            transform: translateY(-20px);
        }

        .nav-button:nth-child(2):hover,
        .nav-button:nth-child(4):hover {
            transform: translateY(-20px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: white;
            width: 100%;
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Featured Content Area */
        .featured-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: white;
            min-height: 300px;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: white;
            width: 100%;
            margin-top: auto;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navigation-buttons {
                gap: 8px;
                padding: 20px 8px;
            }

            .nav-button:nth-child(2),
            .nav-button:nth-child(4) {
                transform: translateY(-10px);
            }

            .nav-button:nth-child(2):hover,
            .nav-button:nth-child(4):hover {
                transform: translateY(-10px) scale(1.05);
            }

            .social-icons {
                gap: 15px;
            }

            .social-icons a {
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>

        </a>
        <a href="#" class="nav-button" title="Store">

        </a>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">
        <img src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">

</body>
</html>
