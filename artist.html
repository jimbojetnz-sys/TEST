<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The artists of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('/FTL_ASSETS/FTL_ARTIST_CAMO.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
        }

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 30px 0;
}

.logo-img {
  max-width: 340px;
  cursor: pointer;
  transition: 0.25s;
}
.logo-img:hover {
  transform: scale(1.05);
}
  
/* CONTACT FOOTER */
.contact-footer {
  display: flex;
  justify-content: center;
  padding: 120px 0 40px;
}

.contact-button {
  cursor: pointer;
  transition: transform 0.2s ease;
}

.contact-button:hover {
  transform: scale(1.1);
}

.contact-button img {
  display: block;
  max-width: 250px;
  width: 100%;
  height: auto;
}
  
/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 28px;
  padding: 0 40px 40px;
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}

.item:hover {
  transform: translateY(-4px);
}

/* IMAGE */
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  cursor: zoom-in;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* NO SCALING */
.thumb:hover img {
  filter: brightness(70%);
}

/* CLICK FEEDBACK */
.thumb:active {
  transform: scale(0.98);
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.8em;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.thumb:hover .overlay {
  opacity: 1;
}

/* META ROW */
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: 0.75em;
  gap: 8px;
}

/* TITLE */
.title {
  font-family: 'Allegiance';
  font-size: 1.2em; /* increased for balance */
}

/* TEXT ALIGNMENT */
.title { text-align: left; }
.date { text-align: center; }
.type { text-align: right; }

/* STRETCH SYSTEM */

/* TITLE (Allegiance - horizontal stretch ONLY) */
.title span {
  display: inline-block;
  transform: scaleX(1.5);
  transform-origin: left;
  white-space: nowrap;
}

/* DATE + TYPE (Arial - vertical stretch ONLY) */
.date span,
.type span {
  display: inline-block;
  transform: scaleY(1.3);
  transform-origin: center;
  white-space: nowrap;
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.lightbox.active {
  opacity: 1;
  pointer-events: all;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
}

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/" title="Back to Home">
    <img src="/FTL_ASSETS/FTL_LOGO.png" alt="FTL Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" alt="">
</div>

<!-- CONTACT FOOTER -->
<div class="contact-footer">
  <a href="https://obssd.online/contact" class="contact-button">
    <img src="/obssd_assets/CONTACT_FOOTER.png" alt="Contact">
  </a>
</div>

<script>
/*
  Fill this array with artist objects. If 'link' is set the thumbnail will open that link in a new tab;
  otherwise it will open the image in the lightbox.
  Example:
    { name: 'Artist Name', image: '/path/to/image.jpg', type: 'cover art', link: 'https://soundcloud.com/artist' }
*/
const artists = [
  { name: 'PRXJECT SIN', image: 'obssd_work/prxjectsin @imobssd.png', type: 'animation', link: 'https://soundcloud.com/example-prxject' },
  { name: 'Jusertz "BLAKK TRUKK"', image: 'obssd_work/juzerts blakktrukk @imobssd.png', type: 'animation', link: 'https://soundcloud.com/example-jusertz' },
  { name: 'Monkayo "Anhedonia"', image: '/obssd_work/monkayo anhedonia @imobssd.webp', type: 'cover art' }, // no link -> lightbox
  { name: '6astard "Restless Dreams"', image: '/obssd_work/6astard restlessdteams 1 @imobssd.webp', type: 'cover art' },
  // Add more entries here...
];

function openLightbox(el) {
  const img = (el.nodeName === 'IMG') ? el : el.querySelector && el.querySelector('img');
  if (!img) return;
  const box = document.getElementById('lightbox');
  const lightImg = document.getElementById('lightbox-img');
  lightImg.src = img.src;
  lightImg.alt = img.alt || '';
  box.classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.getElementById('lightbox-img').src = '';
}

function openLink(url) {
  window.open(url, '_blank');
}

/* Generate gallery items from the artists array */
(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.textContent = 'VIEW';

    thumb.appendChild(img);
    thumb.appendChild(overlay);

    // click behavior: open link if present else open lightbox
    thumb.addEventListener('click', (ev) => {
      if (a.link) {
        openLink(a.link);
      } else {
        openLightbox(thumb);
      }
    });

    const meta = document.createElement('div');
    meta.className = 'meta';

    const title = document.createElement('div');
    title.className = 'title';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = a.name;
    title.appendChild(titleSpan);

    const type = document.createElement('div');
    type.className = 'type';
    const typeSpan = document.createElement('span');
    typeSpan.textContent = a.type || '';
    type.appendChild(typeSpan);

    meta.appendChild(title);
    // optional: meta.appendChild(date) if you want dates later
    meta.appendChild(type);

    item.appendChild(thumb);
    item.appendChild(meta);

    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
